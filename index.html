<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Les aventures de Jarod</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Composition : écrans plein cadre empilés (accueil, choix, fiche) et une vue de jeu plein cadre avec bandeau d'état, scène et commandes tactiles superposées. Ambiance : plage de Grande-Terre en pleine journée, tissu madras comme signature. */
:root{
  --ink:#062b30; --ink-2:#0c3b42; --ink-3:#12505a; --line:#1d5d66;
  --text:#eaf7f4; --muted:#a3cdc7;
  --sea:#1fb9aa; --sun:#ffc531; --hib:#ef3f59; --hib-deep:#c2213c; --cane:#7cc242; --blue:#2a56c6;
  --paper:#f2faf8; --paper-ink:#0b3a41; --paper-line:#c2dfd9; --paper-muted:#41696b;
  --display:'Lilita One','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font:400 16px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.screen{display:none;flex:1;min-height:0;overflow-y:auto;padding-block:14px 32px}
.screen.on{display:block}
.wrap{max-width:760px;margin:0 auto}
.wrap.wide{max-width:860px}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.madras{height:14px;border-radius:3px;background:
  repeating-linear-gradient(90deg,rgba(42,86,198,.78) 0 10px,transparent 10px 26px,rgba(239,63,89,.72) 26px 32px,transparent 32px 52px),
  repeating-linear-gradient(0deg,rgba(255,255,255,.3) 0 2px,transparent 2px 7px),
  var(--sun)}
.scene{display:block;width:100%;height:auto;max-height:130px;margin-top:10px;border-radius:14px;background:linear-gradient(#6fd0e6,#d6f5ee)}
.eyebrow{margin:20px 0 4px;font-size:.8rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--sea)}
h1{margin:0;font:400 clamp(2.6rem,10vw,4.6rem)/1 var(--display);letter-spacing:.01em;text-wrap:balance}
.lead{max-width:56ch;color:var(--muted);font-size:1.08rem;margin:12px 0 22px}
.q{font:400 1.7rem/1.15 var(--display);margin:22px 0 14px;text-wrap:balance}

.choices{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:640px){.choices.two{grid-template-columns:1fr 1fr}}
.card-btn{display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0;padding:16px 18px;background:var(--ink-2);color:var(--text);border:2px solid var(--line);border-radius:14px;font:inherit;cursor:pointer;transition:border-color .15s,transform .15s}
.card-btn .t{font:400 1.35rem/1.15 var(--display)}
.card-btn .d{color:var(--muted);font-size:.95rem}
.card-btn:hover{border-color:var(--sea)}
.card-btn:active{transform:translateY(1px)}
.card-btn.opt .t{font:800 1.02rem/1.3 var(--body)}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:12px;border:2px solid transparent;font:400 1.15rem var(--display);letter-spacing:.02em;cursor:pointer}
.btn-sun{background:var(--sun);color:var(--ink)}
.btn-sun:hover{background:#ffd45e}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--sea)}
.back{background:none;border:0;color:var(--muted);font:600 1rem var(--body);cursor:pointer;padding:10px 0;margin-top:6px}
.mini{min-height:36px;padding:0 14px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--text);font:800 .9rem var(--body);cursor:pointer}
.mini:hover{border-color:var(--sea)}
.atelier{margin-top:26px;border:1px dashed var(--line);border-radius:14px;padding:12px 16px;color:var(--muted)}
.atelier summary{cursor:pointer;font-weight:800;color:var(--text)}
.atelier p{margin:10px 0}
.status{font-size:.92rem;color:var(--muted);margin:8px 0 0;min-height:1.4em}
.status.ok{color:var(--cane)}
.status.err{color:#ff9aa8}

.hero-card{background:var(--ink-2);border:2px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;justify-items:center;min-width:0}
.hero-card h3{margin:0;font:400 1.3rem var(--display)}
.hero-card canvas{width:140px;height:140px;background:linear-gradient(#8fe3ea,#d6f5f0);border-radius:12px}
.swatches{display:flex;gap:10px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--ink-2);box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--sun)}
.small{font-size:.88rem;color:var(--muted);margin:0;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.go{margin-top:20px}

#s-game.on{display:flex;flex-direction:column;gap:8px;overflow:hidden;padding-block:8px}
.hud{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.zone{font:400 1.05rem var(--display);letter-spacing:.02em}
.spot{font-size:.88rem;color:var(--muted)}
.spacer{flex:1}
.hud-players{display:flex;flex-wrap:wrap;gap:6px 18px}
.pl{display:flex;align-items:center;gap:10px;font-size:.88rem}
.pl .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.pips{display:flex;gap:4px}
.pip{width:12px;height:12px;border-radius:50%;border:2px solid var(--sun);box-sizing:border-box}
.pip.f{background:var(--sun)}
.bag{display:flex;gap:6px}
.slot{display:inline-flex;color:#3f7078}
.slot.have{color:var(--sun)}
.slot svg{width:20px;height:20px}
.canvas-wrap{position:relative;flex:1;min-height:0;border-radius:14px;overflow:hidden;background:#7fd6df}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}
.touch{position:absolute;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:12px;pointer-events:none}
@media (pointer:coarse){.touch{display:flex}}
.tb{pointer-events:auto;width:68px;height:68px;border-radius:18px;border:2px solid rgba(255,255,255,.6);background:rgba(6,43,48,.55);color:#fff;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-user-select:none;user-select:none;padding:0}
.tb.big{width:84px;height:84px;border-radius:50%}
.dpad{display:flex;gap:12px}

#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));background:rgba(3,22,26,.84)}
#modal-box{width:100%;max-width:540px;max-height:100%;overflow-y:auto;background:var(--ink-2);border:2px solid var(--line);border-radius:18px;padding:22px}
.m-title{margin:0 0 8px;font:400 1.6rem/1.15 var(--display);text-wrap:balance}
.m-body p{margin:8px 0}
.m-label{font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--sea);margin:14px 0 2px !important}
.m-note{color:var(--muted);font-size:.95rem}
.m-actions{display:grid;gap:10px;margin-top:16px}
.m-actions .btn,.m-actions .card-btn{width:100%}
.tag{display:inline-block;padding:3px 10px;border-radius:6px;background:var(--hib);color:#fff;font:400 .95rem var(--display);letter-spacing:.04em}
.reward{display:flex;align-items:center;gap:14px;margin:12px 0}
.reward svg{width:46px;height:46px;color:var(--sun);flex:none}
.keys{display:grid;gap:4px;margin:8px 0;color:var(--muted);font-size:.95rem}
.keys b{color:var(--text)}
.vidbox{margin-top:10px;border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--muted)}
.vidbox video{display:block;width:100%;max-height:50vh;border-radius:8px;background:#000}

.tabs{display:flex;gap:8px;margin:14px 0}
.tabs .mini[aria-pressed="true"]{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:16px;padding:0 0 26px;overflow:hidden}
.paper .madras{border-radius:0;height:18px}
.paper .in{padding:20px clamp(16px,4vw,32px) 0}
.paper h2{font:400 clamp(1.7rem,5vw,2.4rem)/1.1 var(--display);margin:0 0 2px}
.paper .who{margin:0;color:var(--paper-muted)}
.paper h3{font:800 .8rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--paper-muted);margin:24px 0 6px}
.paper p,.paper li{margin:4px 0}
.paper ul{padding-left:20px;margin:6px 0}
.bagrow{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.bi{display:flex;align-items:center;gap:8px;padding:8px 12px;border:2px solid var(--paper-line);border-radius:12px;font-weight:800;font-size:.92rem}
.bi svg{width:22px;height:22px;color:#0b8f84;flex:none}
.bi.no{opacity:.55}
.bi.no svg{color:var(--paper-muted)}
.action7{border:2px solid var(--hib-deep);border-radius:14px;padding:14px 16px;margin-top:22px;background:#fff}
.action7 .lb{font:400 1.05rem var(--display);color:var(--hib-deep);letter-spacing:.03em}
.seen{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:1px 8px;border-radius:6px;background:#d8f2e2;color:#145a30;margin-left:6px}
.seen.no{background:#e7ecec;color:var(--paper-muted)}
.note{margin:22px 0 0;font-size:.88rem;color:var(--paper-muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
#copy-area{display:block;width:100%;min-height:140px;margin-top:12px;border-radius:10px;border:2px solid var(--line);background:var(--ink-2);color:var(--text);font:400 .9rem/1.4 var(--body);padding:10px;box-sizing:border-box}
#s-map{background:linear-gradient(#5cc2f2,#b7e8ff 62%,#9be37a);border-radius:22px;padding-inline:14px}
.btn.go{display:flex;margin:22px auto 0;min-width:120px}.btn:disabled{opacity:.4;cursor:default}
#s-map .back{color:var(--ink)}
.mapbox{border-radius:18px;overflow:hidden;border:4px solid #fff}#map{display:block;width:100%;height:auto}

/* ---------- Page d'accueil : Les aventures de Jarod ---------- */
#s-mode{padding:0;border-radius:22px;background:#0b3a41 center bottom/cover no-repeat}
#s-mode.on{display:block}
.home{min-height:100%;display:flex;flex-direction:column;align-items:center;background:linear-gradient(rgba(3,26,30,.45),rgba(3,26,30,0) 40%)}
.home-main{flex:1;width:100%;max-width:980px;display:flex;flex-direction:column;align-items:center;padding:clamp(10px,2.4vh,26px) 14px 0}
.logo{margin:0;display:flex;flex-direction:column;align-items:center;font:400 1rem/.95 var(--display);isolation:isolate;filter:drop-shadow(0 6px 0 rgba(20,40,10,.45));text-align:center}
.logo>span{display:block;position:relative}
.ol::before,.l2 i::before{content:attr(data-t);position:absolute;left:0;top:0;z-index:-1;color:#1d3b12;-webkit-text-stroke:.24em #1d3b12}
.l1{font-size:clamp(1.3rem,min(5vw,5.2vh),2.5rem);color:#fff;letter-spacing:.06em;rotate:-3deg;margin-bottom:-.12em}
.l2{font-size:clamp(3.4rem,min(15vw,15vh),7.4rem);letter-spacing:.02em}
.l2 i{display:inline-block;position:relative;font-style:normal;color:transparent;rotate:calc((var(--i) - 2) * 3deg);animation:bn 2.2s ease-in-out infinite;animation-delay:calc(var(--i) * -.2s)}
.l2 i b{font-weight:inherit;background:linear-gradient(#fff6a8 0%,#ffc531 38%,#ff7a1a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes bn{50%{transform:translateY(-7px)}}
.choose{margin:clamp(6px,1.4vh,14px) 0 clamp(8px,1.6vh,16px);padding:.15em .9em .2em;border-radius:999px;background:rgba(3,26,30,.62);color:#fff;font:400 clamp(1rem,2.6vh,1.35rem) var(--display);letter-spacing:.04em}

.duo{display:flex;justify-content:center;gap:clamp(14px,4vw,40px);width:100%}
.hp{--bg:#ffc531;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  height:clamp(220px,37vh,400px);aspect-ratio:3/4;max-width:44vw;padding:0 0 0;
  background:var(--bg);border:5px solid #fff;border-radius:28px;box-shadow:0 8px 0 rgba(10,30,10,.5),0 14px 28px rgba(0,0,0,.3);
  cursor:pointer;overflow:hidden;color:#fff;font:inherit;transition:transform .18s,box-shadow .18s}
.hp.bot{--bg:#6f56d8}
.hp:hover,.hp:focus-visible{transform:translateY(-8px) rotate(-1deg);box-shadow:0 14px 0 rgba(10,30,10,.5),0 22px 34px rgba(0,0,0,.35)}
.hp.bot:hover,.hp.bot:focus-visible{rotate:0deg;transform:translateY(-8px) rotate(1deg)}
.hp:active{transform:translateY(0)}
.hp .pic{flex:1;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center;padding:12px 10px 0}
.hp .pic img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25));animation:fl 2.6s ease-in-out infinite}
.hp.bot .pic img{animation-delay:-1.3s}
@keyframes fl{50%{transform:translateY(-9px) rotate(1.5deg)}}
.hp .plate{width:100%;padding:8px 8px 10px;background:rgba(10,30,50,.82);background:color-mix(in srgb,var(--bg) 45%,#0a1e32);text-align:center;line-height:1.1}
.hp .nm{display:block;font:400 clamp(1.3rem,3.6vh,2rem) var(--display);letter-spacing:.03em;color:#fff}
.hp .ds{display:block;margin-top:2px;font:800 clamp(.7rem,1.7vh,.9rem) var(--body);letter-spacing:.08em;text-transform:uppercase;color:#ffe08a}

.troupe{display:flex;align-items:flex-end;justify-content:center;gap:clamp(0px,.8vw,12px);width:100%;margin-top:clamp(10px,2.4vh,28px);--u:clamp(64px,min(15vw,19vh),180px)}
.troupe img{height:calc(var(--u) * var(--h));width:auto;min-width:0;max-width:13vw;object-fit:contain;flex:none;filter:drop-shadow(0 5px 3px rgba(0,0,0,.28));animation:fl 3s ease-in-out infinite;animation-delay:calc(var(--d) * -.4s)}
.troupe img.sm{align-self:flex-end;margin-bottom:.4vh}

.foot{width:100%;margin-top:clamp(14px,3vh,30px);background:rgba(6,32,36,.92);color:var(--muted);border-top:4px solid #7cc242;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.82rem}
.foot-in{max-width:760px;margin:0 auto;display:grid;gap:2px;justify-items:center}
.foot p{margin:0}
.foot .brand{font:400 1.05rem var(--display);color:#fff;letter-spacing:.03em}
.foot nav{display:flex;flex-wrap:wrap;gap:0 18px;justify-content:center;align-items:center}
.foot nav button{background:none;border:0;padding:6px 2px;min-height:32px;color:var(--text);font:800 .86rem var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.foot nav button:hover{color:var(--sun)}
.cgu h3{margin:16px 0 4px;font:400 1.1rem var(--display);color:var(--sun)}
.cgu p{margin:4px 0;font-size:.95rem}
.cgu .m-note{margin-top:14px}

@media (max-width:520px){.hp{max-width:46vw}.troupe{gap:0;--u:17vw}.troupe img{max-width:12vw}}
@media (max-height:620px){.hp{height:clamp(190px,46vh,300px)}}
@media (prefers-reduced-motion:reduce){.card-btn,.hp{transition:none}.hp .pic img,.troupe img,.l2 i{animation:none}}

/* ---------- Vidéos plein écran ---------- */
#fv{position:fixed;inset:0;z-index:60;background:#000;color:#fff}
#fv-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#fv-top{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 22px;background:linear-gradient(rgba(0,0,0,.6),transparent)}
.fv-who{font:400 1.1rem var(--display);padding:3px 14px;border-radius:999px;background:var(--sea);color:var(--ink)}
.fv-who.dark{background:#6f56d8;color:#fff}.fv-who.jarod{background:var(--sun)}
#fv-bar{position:absolute;left:0;bottom:0;height:5px;background:var(--sun);width:0;z-index:3}
#fv-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;background:radial-gradient(circle at 50% 40%,#12505a,#062b30)}
#fv-ph img{height:30vh;max-width:60vw;object-fit:contain}#fv-ph p{margin:0}#fv-ph code{color:var(--sun)}
#fv-play{position:absolute;inset:0;z-index:1;background:rgba(0,0,0,.35);border:0;color:#fff;font:400 2rem var(--display);cursor:pointer}
#fv-panel{position:absolute;left:0;right:0;bottom:0;z-index:2;max-height:80%;overflow-y:auto;padding:40px 16px calc(20px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(3,22,26,.92) 28%)}
.fv-in{max-width:720px;margin:0 auto}
.fv-q{margin:0 0 8px;font:400 1.5rem/1.15 var(--display);text-wrap:balance}
.fv-say{margin:0 0 12px;padding:10px 14px;border-left:5px solid #6f56d8;background:rgba(0,0,0,.45);border-radius:8px;font-weight:800}
.fv-note{margin:0 0 10px;color:var(--muted)}.fv-ch{display:grid;gap:10px}.fv-in p{margin:6px 0}
.cl{list-style:none;margin:10px 0;padding:0;display:grid;gap:8px}
.cl label{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--ink-2);cursor:pointer}
.cl label:has(input:checked){border-color:var(--sun);background:#16525a}
.cl input{width:24px;height:24px;margin:1px 0 0;accent-color:var(--sun);flex:none}
.cl b{display:block}.cl .d{display:block;color:var(--muted);font-size:.95rem}
.cl-foot{display:flex;align-items:center;justify-content:space-between;gap:12px}

  if (o.glide && S.glide) return S.glide;
  if (o.hurt && S.hurt) return S.hurt;

  if (o.land && S.land) return S.land;
  if (o.moving) return S.run[Math.floor(o.t * 8) % S.run.length];

const HOME = [
  { k: 'hero', img: 'jarod', cls: '', nm: 'Jarod', ds: 'Le héros', label: 'Jouer avec Jarod' },
  { k: 'bot', img: 'bishop', cls: 'bot', nm: 'Bishop', ds: 'Le petit robot', label: 'Jouer avec Bishop' }
];
const TROUPE = [['blue', .5, 'Petit monstre bleu'], ['mage', .86, 'Le mage'], ['jarod', 1, 'Jarod'], ['bishop', .74, 'Bishop'], ['cat', .42, 'Le chat violet'], ['yellow', .5, 'Petit monstre jaune'], ['ghost', .78, 'Le fantôme'], ['dark', .86, 'Le sorcier']];
const ens = k => 'data:image/webp;base64,' + ENS[k];
function drawPicks() {
  $('#pick').innerHTML = HOME.map(h => `<button type="button" class="hp ${h.cls}" data-k="${h.k}" aria-label="${h.label}"><span class="pic"><img src="${ens(h.img)}" alt=""></span><span class="plate"><span class="nm">${h.nm}</span><span class="ds">${h.ds}</span></span></button>`).join('');
  $('#troupe').innerHTML = TROUPE.map((t, i) => `<img src="${ens(t[0])}" alt="${t[2]}" style="--h:${t[1]};--d:${i}">`).join('');
  $$('.hp').forEach(b => b.addEventListener('click', () => {
    setup.mode = 1; setup.sel = [b.dataset.k]; setup.profiles = [null, null]; buildMap(); show('s-map');
  }));
}

    + `<text x="16" y="30" font-size="22" fill="#062b30" ${F} text-anchor="start">La Prairie des Rêves</text><text x="16" y="364" font-size="13" fill="#062b30" ${F} text-anchor="start">Des dangers se cachent sur la route…</text>`;
  const toks = setup.sel.map(k => { const im = CH[k].img, w = Math.round(46 * (im.naturalWidth / (im.naturalHeight || 1)) || 35); return `<image class="tk" href="${SRC[k]}" width="${w}" height="46"/>`; }).join('');

/* ---------- Héros ---------- */
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255), g = clamp(((n >> 8) & 255) + amt, 0, 255), b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}
function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); }
// Dessin du héros, pieds à l'origine. Un sprite importé remplace le héros par défaut.
function drawHero(c, o) {
  c.save();
  c.fillStyle = 'rgba(0,0,0,.18)'; c.beginPath(); c.ellipse(0, 0, 16, 4, 0, 0, 6.283); c.fill();
  c.scale(o.face, 1);
  const S = o.set, im = S ? posePick(S, o) : o.sprite, h = S ? im.height * S.H / Math.max(1, S.idle.height) : 66, w = h * im.width / Math.max(1, im.height), vy = o.vy || 0;
  const k = o.air ? clamp(-vy / 800, -.3, .3) : 0, bob = o.moving && !o.air ? Math.abs(Math.sin(o.t * 12)) * 3 : 0;
  c.translate(0, -h / 2 - bob);
  c.rotate(0);
  c.scale(1, o.air || o.moving ? 1 : 1 + Math.sin(o.t * 3) * .02);
  c.drawImage(im, -w / 2, -h / 2, w, h);
  if (o.glide && !S) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; c.lineCap = 'round';
    for (let i = 0; i < 2; i++) { c.beginPath(); c.ellipse(0, -h / 2 - 2, 24, 6, 0, o.t * 25 + i * 3.1, o.t * 25 + i * 3.1 + 1.6); c.stroke(); } }
  c.restore();
}
function loadSprite(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const sc = Math.min(1, 256 / img.height), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}
function drawPreview(i) {
  const c = $('#prev-' + i); if (!c) return;
  const x = c.getContext('2d');
  x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, 280, 280);
  x.setTransform(3.2, 0, 0, 3.2, 130, 232);
  drawHero(x, { color: CH[setup.sel[i]].c, sprite: CH[setup.sel[i]].img, set: CH[setup.sel[i]].set, dbl: false, glide: false, face: 1, t: 0, moving: false, air: false });
}
function buildChars() {
  const box = $('#char-cards');
  box.innerHTML = ''; box.className = 'choices' + (setup.mode === 2 ? ' two' : '');
  for (let i = 0; i < setup.mode; i++) {
    const card = document.createElement('div'); card.className = 'hero-card';
    card.innerHTML = `<h3>${setup.mode === 2 ? 'Joueur ' + (i + 1) : 'Ton héros'}</h3>
      <canvas width="280" height="280" id="prev-${i}" aria-label="Aperçu du héros"></canvas>
      <div class="swatches" role="group" aria-label="Couleur du héros"></div>
      <div class="row"><button type="button" class="mini" id="up-${i}">Utiliser mon personnage</button><button type="button" class="mini" id="rm-${i}" hidden>Retirer</button></div>
      <input type="file" id="file-char-${i}" accept="image/*" hidden>
      <p class="small" id="msg-${i}">Image PNG à fond transparent conseillée.</p>`;

      if (Math.hypot(p.x - c.x, (p.y - 24) - c.y) < 26) { c.got = true; p.perles++; hudDirty = true; sfx('coin'); burst(c.x, c.y, '#ffd45e', 6); }
    }
  }
  for (const st of stations) {
    if (st.started) continue;
    if (players.some(p => p.x > st.x - 70)) { st.started = true; task(() => runStation(st)); }
  }
  for (let i = cpIndex + 1; i < CHECKPOINTS.length; i++) {
    if (players.some(p => p.x >= CHECKPOINTS[i])) { cpIndex = i; sfx('check'); burst(CHECKPOINTS[i], GROUND - 40, '#7cc242', 12); }
  }
  for (const p of players) if (!p.arrived && Math.abs(p.x - LIGHT_X) < 50 && p.onGround) p.arrived = true;
  if (!finishing && players.every(p => p.arrived)) { finishing = true; task(finishLevel); }
  for (const q of particles) { q.l -= dt; q.vy += 900 * dt; q.x += q.vx * dt; q.y += q.vy * dt; }
  particles = particles.filter(q => q.l > 0);
  const lead = players.length > 1 ? Math.max(...players.map(p => p.x)) : players[0].x;
  const tx = clamp(lead - viewW * 0.42, 0, Math.max(0, WORLD_W - viewW));
  camX += (tx - camX) * Math.min(1, dt * 6);
  if (hudDirty) { renderHud(); hudDirty = false; }
}

function notice(e, how, out) {
  if (spotted.has(e.id) || (how === 'hit' && e.talked)) return;
  spotted.add(e.id); hudDirty = true;
  task(() => modal({
    title: how === 'stomp' ? 'Piège démasqué !' : 'Aïe, un piège !',
    body: `<p><span class="tag">${e.sign}</span></p><p class="m-label">Le réflexe à garder</p><p>${e.lesson}</p>` +
      (how === 'hit' ? '<p class="m-note">La prochaine fois, saute dessus pour le démasquer.</p>' : '') +
      (out ? '<p class="m-note">Plus d\'énergie : tu repars du dernier point de contrôle, sans pénalité.</p>' : ''),
    actions: [{ label: 'Compris', value: true }]
  }));
}

async function runStation(st) {
  const si = STATIONS.indexOf(st);
  for (const p of players) {
    const who = players.length > 1 ? `Joueur ${p.i + 1} · ` : '';
    const opts = st.options(p);
    const idx = await cinema({ key: 'mage' + si, src: VIDEOS.mage[si], who: 'Maître Azur', cls: '', img: WZ.wiz.src,
      build: (box, fin) => choiceUI(box, { q: st.ask(p), note: `${who}Maître Azur t'écoute. Il n'y a pas de mauvaise réponse.`, options: opts.map((o, i) => ({ label: o.label, value: i })), onPick: fin }) });
    const o = opts[idx]; p.answers[st.key] = o; p.bag[st.item] = true; sfx('check'); renderHud();
    const b = BAG.find(x => x.k === st.item);
    await modal({
      title: 'Dans ton sac',
      body: `<div class="reward">${icon(st.item)}<div><b>${b.name}</b> : ${b.desc}</div></div><p>${st.praise(o)}</p>`,
      actions: [{ label: 'Continuer', value: true }]
    });
  }
  st.done = true;
}

async function finishLevel() {
  for (const st of stations) if (!st.started) { st.started = true; await runStation(st); }
  const seal = spotted.size >= 3;
  players.forEach(p => { p.bag.shield = seal; }); renderHud(); sfx('win');
  await modal({
    title: 'Tu as atteint le phare !',
    body: seal
      ? `<div class="reward">${icon('shield')}<div><b>Sceau</b> : ton réflexe anti-arnaque</div></div><p>Tu as repéré ${spotted.size} pièges sur ${TRAPS.length}. Ce réflexe te servira à chaque fois qu'on te proposera une formation.</p>`
      : `<p>Tu as repéré ${spotted.size} piège${spotted.size > 1 ? 's' : ''} sur ${TRAPS.length}. Il en faut au moins 3 pour gagner le Sceau. Tu pourras rejouer la zone pour l'obtenir.</p>`,
    actions: [{ label: 'Continuer', value: true }]
  });
  await modal({
    title: 'Un parcours en vidéo',
    body: '<p>Une personne qui a fait ce chemin te raconte comment elle s\'y est prise.</p><div id="vid-slot"></div>',
    actions: [{ label: 'Voir ma fiche de route', value: true }], onMount: renderVideoSlot
  });
  showFiche(0);
}

    x.font = `800 ${Math.round(14 * Math.max(1, s))}px Nunito, system-ui, sans-serif`; x.textAlign = 'center';
    const tw = x.measureText(msg).width + 28;
    x.fillStyle = 'rgba(6,43,48,.8)'; rr(x, W / 2 - tw / 2, 14, tw, 34 * Math.max(1, s), 10); x.fill();
    x.fillStyle = '#fff'; x.fillText(msg, W / 2, 14 + 22 * Math.max(1, s));
  }
}

/* ---------- Fiche de route ---------- */
let ficheIndex = 0;
function ficheModel(p) {
  const t = p.answers.taste || TASTES[0], c = p.answers.constraint || CONSTRAINTS[0], a = p.answers.atout || ATOUTS[p.profile][0];
  const jeune = p.profile === 'jeune';
  return {
    heading: players.length > 1 ? `Fiche de route · Joueur ${p.i + 1}` : 'Ta fiche de route',
    who: PROFILES[p.profile].label, t, c, a,
    action: jeune
      ? `Prends rendez-vous cette semaine avec la Mission locale la plus proche de chez toi. Elle accompagne gratuitement les 16-25 ans. Apporte ta liste d'envies : ${t.label.toLowerCase()}.`
      : `Prends rendez-vous cette semaine avec un conseiller en évolution professionnelle (service gratuit). Avant le rendez-vous, consulte toi-même ton solde sur le site officiel du compte formation : moncompteformation.gouv.fr.`,
    prep: jeune
      ? ["Ta pièce d'identité", 'Un justificatif de domicile', `Un CV simple, même court, avec ton atout : ${a.label.toLowerCase()}`, 'Un RIB']
      : ["Ta pièce d'identité", `Un CV à jour avec ton atout : ${a.label.toLowerCase()}`, 'Tes derniers bulletins de salaire ou attestations de travail', 'Ton numéro de sécurité sociale, pour te connecter toi-même à ton compte formation'],
    checks: ['Cet organisme est-il certifié Qualiopi ?', 'La formation mène-t-elle à un diplôme ou un titre inscrit au RNCP ?', 'Puis-je recevoir le programme, la durée et le prix par écrit ?', 'Quels débouchés en Guadeloupe, avec quels employeurs ?', "Ai-je le droit de réfléchir avant de signer ?"],
    traps: TRAPS.map(tr => ({ sign: tr.sign, lesson: tr.lesson, seen: spotted.has(tr.id) })),
    seal: p.bag.shield, cl: p.cl || []
  };
}
function ficheHtml(m, p) {
  const li = arr => '<ul>' + arr.map(x => `<li>${x}</li>`).join('') + '</ul>';
  return `<div class="madras" aria-hidden="true"></div><div class="in">
    <h2>${m.heading}</h2><p class="who">${m.who} · Zone 1 terminée</p>
    <h3>Ton sac</h3><div class="bagrow">${BAG.map(b => `<span class="bi${p.bag[b.k] ? '' : ' no'}">${icon(b.k)}${b.name}</span>`).join('')}</div>
    ${m.seal ? '' : '<p>Il te manque le Sceau : démasque au moins 3 pièges en rejouant la zone.</p>'}
    <h3>Ce que tu as choisi</h3>
    ${li([`<b>Ce qui t'attire :</b> ${m.t.label}. Pistes à explorer : ${m.t.sectors}.`, `<b>Ta priorité :</b> ${m.c.label}. Ton réflexe : ${m.c.tip}`, `<b>Ton atout :</b> ${m.a.label}.`])}
    <div class="action7"><div class="lb">Ta première démarche, dans les 7 jours</div><p>${m.action}</p></div>
    <h3>À préparer</h3>${li(m.prep)}
    <h3>Ma check-list avant de me lancer</h3>${li(CHECKLIST.map(c => `<b>${c.t}</b><span class="seen${m.cl.includes(c.id) ? '' : ' no'}">${m.cl.includes(c.id) ? 'prêt' : 'à vérifier'}</span>${c.d ? '<br>' + c.d : ''}`))}
    <h3>Questions à poser avant de t'inscrire</h3>${li(m.checks)}
    <h3>Tes réflexes anti-arnaque</h3>${li(m.traps.map(t => `<b>${t.sign}</b><span class="seen${t.seen ? '' : ' no'}">${t.seen ? 'repéré' : 'à découvrir'}</span><br>${t.lesson}`))}
    <p class="note">Prototype de démonstration : les dispositifs cités doivent être vérifiés et mis à jour avec des partenaires locaux avant toute diffusion.</p></div>`;
}
function ficheText(m) {
  const L = [m.heading, `${m.who} · Zone 1 terminée`, '',
    `Ce qui t'attire : ${m.t.label}. Pistes : ${m.t.sectors}.`, `Ta priorité : ${m.c.label}. Ton réflexe : ${m.c.tip}`, `Ton atout : ${m.a.label}.`, '',
    'PREMIÈRE DÉMARCHE (7 jours)', m.action, '', 'À PRÉPARER'];
  m.prep.forEach(x => L.push('- ' + x));
  L.push('', 'MA CHECK-LIST AVANT DE ME LANCER'); CHECKLIST.forEach(c => L.push(`- [${m.cl.includes(c.id) ? 'x' : ' '}] ${c.t}${c.d ? ' : ' + c.d : ''}`));
  L.push('', "QUESTIONS À POSER AVANT DE T'INSCRIRE"); m.checks.forEach(x => L.push('- ' + x));
  L.push('', 'RÉFLEXES ANTI-ARNAQUE'); m.traps.forEach(t => L.push(`- ${t.sign} : ${t.lesson}`));
  return L.join('\n');
}
function showFiche(i) {
  ficheIndex = i; show('s-end');
  const tabs = $('#fiche-tabs'); tabs.innerHTML = '';
  if (players.length > 1) players.forEach((p, k) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'mini'; b.textContent = 'Joueur ' + (k + 1);
    b.setAttribute('aria-pressed', String(k === i)); b.addEventListener('click', () => showFiche(k)); tabs.appendChild(b);
  });
  $('#fiche').innerHTML = ficheHtml(ficheModel(players[i]), players[i]);
  $('#copy-status').textContent = ''; $('#copy-area').hidden = true;
}
$('#btn-copy').addEventListener('click', () => {
  const text = ficheText(ficheModel(players[ficheIndex])), st = $('#copy-status'), area = $('#copy-area');
  const fallback = () => { area.value = text; area.hidden = false; area.focus(); area.select(); st.textContent = 'Sélectionne le texte et copie-le (Ctrl+C ou appui long).'; st.className = 'status'; };
  try {
    navigator.clipboard.writeText(text).then(() => { st.textContent = 'Fiche copiée. Tu peux la coller dans un message ou un document.'; st.className = 'status ok'; area.hidden = true; }).catch(fallback);
  } catch (_) { fallback(); }
});
$('#btn-replay').addEventListener('click', startGame);
$('#btn-menu').addEventListener('click', () => show('s-mode'));
$('#btn-quit').addEventListener('click', () => {
  modal({ title: 'Quitter la partie ?', body: '<p>Ta progression dans cette zone sera perdue.</p>',
    actions: [{ label: 'Continuer à jouer', value: false }, { label: 'Quitter', value: true, cls: 'btn-ghost' }] })
    .then(v => { if (v) show('s-mode'); });
});
})();
</script>
